# S3-compatible object store for Flink's RocksDB checkpoints/savepoints.
#
# JobManager and TaskManager are separate pods that need to share durable
# checkpoint state; k3s'/k3d's local-path storage class is RWO only, so a
# filesystem state backend (what Mimir uses, see deploy/k3s/10-mimir.yaml) is
# not an option here -- the sharing has to happen over a network protocol
# (S3), not a shared mount.
#
# Was MinIO (bundled with Mimir) until quay.io/minio/minio started returning
# 401 for every tag, anonymous or not -- MinIO Inc.'s 2024 distribution
# policy change, confirmed with a plain `docker pull` (see
# docs/evidence/real-telemetry-live.md and deploy/k3s/10-mimir.yaml's
# history). SeaweedFS (chrislusf/seaweedfs, Apache-2.0) is a maintained,
# freely-pullable S3-compatible alternative.
#
# -s3.config gives it one fixed identity matching flink-s3-creds'
# placeholder/placeholder values. A simple unsigned PUT works without it, but
# pyarrow's S3FileSystem (kb/store.py, via the Beam sink) does a real
# multipart upload for Parquet writes, and seaweedfs' multipart path *does*
# check the access key even when simple PUT doesn't -- verified locally:
# unsigned multipart fails INVALID_ACCESS_KEY_ID, the same request with this
# identity configured succeeds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: patchtst
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "placeholder",
          "credentials": [{"accessKey": "placeholder", "secretKey": "placeholder"}],
          "actions": ["Admin", "Read", "Write"]
        }
      ]
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: patchtst
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: patchtst
  labels:
    app.kubernetes.io/part-of: patchtst-pipeline
    app.kubernetes.io/component: object-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: object-store
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: patchtst-pipeline
        app.kubernetes.io/component: object-store
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -ip=0.0.0.0
          ports:
            - { name: s3, containerPort: 8333 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: patchtst
spec:
  selector:
    app.kubernetes.io/component: object-store
  ports:
    - { port: 8333, targetPort: 8333 }
