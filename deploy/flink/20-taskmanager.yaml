# Flink TaskManager — executes the tasks. Each pod carries a Beam Python SDK
# harness sidecar (external worker pool): the TaskManager (JVM) runs the Flink
# operators and calls localhost:50000 over the Fn API to execute the Python
# DoFns (the detector). This is the EXTERNAL environment the pipeline options
# point at (environment_type=EXTERNAL, environment_config=localhost:50000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: patchtst
  labels:
    app.kubernetes.io/part-of: patchtst-pipeline
    app.kubernetes.io/component: flink-taskmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: flink-taskmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: patchtst-pipeline
        app.kubernetes.io/component: flink-taskmanager
    spec:
      containers:
        - name: taskmanager
          image: flink:1.20.1-scala_2.12-java11
          args: ["taskmanager"]
          ports:
            - { name: rpc, containerPort: 6122 }
          envFrom:
            - secretRef: { name: flink-s3-creds }
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              valueFrom:
                configMapKeyRef: { name: flink-config, key: ENABLE_BUILT_IN_PLUGINS }
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
          resources:
            requests: { cpu: 250m, memory: 2Gi }
        # Python SDK harness: runs the pipeline's Python code on demand. Must be
        # OUR worker image (deploy/dataflow/Dockerfile: Beam SDK + connectors,
        # detection, kb, inference): the stock beam_python3.11_sdk image cannot
        # unpickle the pipeline's DoFns (ModuleNotFoundError: connectors).
        #   docker build -f deploy/dataflow/Dockerfile -t patchtst-beam-worker:2.76.0 .
        - name: beam-worker-pool
          image: patchtst-beam-worker:2.76.0
          imagePullPolicy: IfNotPresent
          command: ["/opt/apache/beam/boot"]
          args: ["--worker_pool"]
          ports:
            - { name: worker-pool, containerPort: 50000 }
          envFrom:
            - secretRef: { name: flink-s3-creds }   # AWS_* for the s3:// signal sink
          env:
            # Without this, every pyarrow.fs S3FileSystem construction (kb/store.py
            # runs one per window write) first probes the EC2 metadata service
            # (169.254.169.254) for creds/region, has no route to it here, and
            # pays an ~8s timeout before falling back to the env credentials —
            # multiplied across windows this stalls the job for minutes.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          resources:
            requests: { cpu: 100m, memory: 1Gi }
      volumes:
        - name: flink-config
          configMap:
            name: flink-config
            items:
              - { key: flink-conf.yaml, path: flink-conf.yaml }
