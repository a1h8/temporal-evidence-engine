# Runs the real D1 regime-switch detector (PatchTST forecast face +
# self-supervised reconstruction face, both trained on the fly — see
# config/pipeline.example.yaml) against the long synthetic series, instead of
# the dependency-free ZScoreDetector the base deploy/k3s CronJob uses. A
# one-shot Job, not a CronJob: training on the fly per tick is compute-heavy
# (detection/patchtst.py's own docstring: "fit for periodic/scoped
# assessment, not high-frequency cluster-wide scoring").
#
# Needs the torch-enabled image:
#   docker build --build-arg INSTALL_TORCH=1 -t patchtst-pipeline:torch .
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-patchtst-config
  namespace: patchtst
data:
  pipeline.yaml: |
    source:
      type: mimir
      params:
        endpoint: http://mimir-gateway.patchtst.svc.cluster.local:80
        promql: '{__name__=~"sim_.+", namespace="demo", pod="node4"}'
        start: __START__          # epoch seconds, filled in at runtime
        end: __END__
        step_s: 15
        group_by: [pod, namespace]
        channel_label: __name__
    detector:
      type: regime-switch
      forecast:
        type: patchtst
      detective:
        type: reconstruction
      # Each Job run is a fresh process: without this every run starts NORMAL
      # and the detective face never runs. kb seeds the regime from the last
      # signal persisted below, so run 2 resumes the INCIDENT run 1 entered.
      state:
        type: kb
        root: /data/kb
    sinks:
      - type: signal-store
        params:
          root: /data/kb
    engine:
      type: local
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pipeline-patchtst
  namespace: patchtst
spec:
  backoffLimit: 1
  # Training two small PatchTST models on the fly needs more time/CPU than the
  # zscore CronJob tick.
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      # `kubectl apply -k` creates this Job alongside ingest-seed-long, so wait
      # until Mimir serves the seeded series before scoring it.
      initContainers:
        - name: wait-for-seed
          image: patchtst-pipeline:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import json, time, urllib.parse, urllib.request
              q = 'count_over_time(sim_cpu{namespace="demo", pod="node4"}[1h])'
              url = ("http://mimir-gateway.patchtst.svc.cluster.local:80"
                     "/prometheus/api/v1/query?query=" + urllib.parse.quote(q))
              while True:
                  try:
                      res = json.load(urllib.request.urlopen(url, timeout=10))
                      n = int(float(res["data"]["result"][0]["value"][1]))
                  except (OSError, LookupError, ValueError):
                      n = 0
                  print(f"sim_cpu samples for node4: {n}", flush=True)
                  if n >= 200:
                      break
                  time.sleep(5)
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: pipeline
          image: patchtst-pipeline:torch
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              END=$(date +%s); START=$((END - 3600))
              sed "s/__START__/$START/; s/__END__/$END/" \
                /config/pipeline.yaml > /tmp/pipeline.yaml
              exec python -m pipeline /tmp/pipeline.yaml
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: datalake
              mountPath: /data/kb
      volumes:
        - name: config
          configMap:
            name: pipeline-patchtst-config
        - name: datalake
          persistentVolumeClaim:
            claimName: kb-datalake
