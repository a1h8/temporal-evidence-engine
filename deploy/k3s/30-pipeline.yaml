# Detection pipeline as a CronJob (the `engine: local` deployment target).
#
# Each tick: read the last hour of real pod-restart telemetry from Mimir, run
# the detector, write aggregated SignalRecords to the KB datalake. The runner
# takes static start/end, so the rolling window is computed at runtime and
# substituted into the mounted config (placeholders __START__/__END__).
#
# promql is `increase(kube_pod_container_status_restarts_total[10m])` — real
# cluster telemetry via kube-state-metrics -> Prometheus remote_write -> Mimir
# (enabled 2026-09-28), not the `sim_*` fixtures. It's the live counterpart of
# scenarios.library.noisy_baseline_no_incident's pod_restart_count shape.
#
# Detector is `zscore` (dependency-free). For PatchTST/reconstruction, build the
# image with --build-arg INSTALL_TORCH=1 and swap the `detector:` block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: patchtst
data:
  pipeline.yaml: |
    source:
      type: mimir
      params:
        endpoint: http://mimir-gateway.patchtst.svc.cluster.local:80
        promql: 'increase(kube_pod_container_status_restarts_total[10m])'
        start: __START__          # epoch seconds, filled in at runtime
        end: __END__
        step_s: 60
        group_by: [pod, namespace]
        channel_label: __name__
    detector:
      type: zscore
    sinks:
      - type: signal-store
        params:
          root: /data/kb
    engine:
      type: local
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline
  namespace: patchtst
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Bounds the whole Job, retries included, under the 5-min schedule, so a
      # lasting Mimir outage never makes Forbid skip the next tick.
      activeDeadlineSeconds: 280
      template:
        spec:
          restartPolicy: Never
          # Waits until Mimir's read path answers before the run reads
          # (docs/PIPELINE_STARTUP.md): after a reboot the first tick otherwise
          # fails with "Connection refused". At most 240 s, under the schedule.
          initContainers:
            - name: wait-for-mimir
              image: patchtst-pipeline:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  import json, sys, time, urllib.request, yaml
                  ep = yaml.safe_load(open("/config/pipeline.yaml"))["source"]["params"]["endpoint"]
                  url = ep.rstrip("/") + "/prometheus/api/v1/query?query=vector(1)"
                  deadline = time.monotonic() + 240
                  last = "no success status"
                  while True:
                      try:
                          with urllib.request.urlopen(url, timeout=5) as r:
                              if json.loads(r.read()).get("status") == "success":
                                  print("mimir ready:", ep)
                                  sys.exit(0)
                      except Exception as e:
                          last = e
                      if time.monotonic() > deadline:
                          sys.exit(f"mimir not ready after 240 s at {ep}: {last}")
                      time.sleep(5)
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          containers:
            - name: pipeline
              image: patchtst-pipeline:dev
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  END=$(date +%s); START=$((END - 3600))
                  sed "s/__START__/$START/; s/__END__/$END/" \
                    /config/pipeline.yaml > /tmp/pipeline.yaml
                  exec python -m pipeline /tmp/pipeline.yaml
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: datalake
                  mountPath: /data/kb
          volumes:
            - name: config
              configMap:
                name: pipeline-config
            - name: datalake
              persistentVolumeClaim:
                claimName: kb-datalake
